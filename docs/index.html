<style>
/* ===========================================================================
   1. THEME — every colour and surface. Edit freely; no data/logic depends on it.
   ========================================================================= */
:root{
  /* Off-black, not pure black. The map's whole job is dormant-vs-active contrast,
     and #000 leaves no room below the dimmest signal. */
  --void:#0A0C11; --panel:rgba(14,17,24,.86); --panel-solid:#0E1118;
  --line:#1E2430; --line-hot:#35425C;
  --grid:rgba(124,144,178,.05);        /* camera-anchored grid */
  --heat:124,144,178;                  /* timeline activity strip (r,g,b) */
  --cyan:#3DD6D0; --magenta:#FF4D6A; --yellow:#E8B33C; --violet:#8B7FE8; --green:#4FD98A;
  --accent:#F2F7FF;                    /* RESERVED: capital moving right now */
  --ink:#DDE4EF; --muted:#8290A8; --faint:#4A5568;
  --in:#4FD98A;                        /* inbound  / fed by   */
  --out:#FF4D6A;                       /* outbound / feeding  */
  --hover:#161C27; --field:#0C0F16; --tab-on:#151B27;
  --hair:rgba(30,36,48,.75);           /* list separators */
  /* HUD chrome: panels are cut, not rounded, and framed by corner marks rather
     than full borders. Structure borrowed, palette unchanged. */
  --notch:11px;                        /* corner cut on panels */
  --notch-sm:6px;                      /* corner cut on controls */
  --bracket:rgba(61,214,208,.30);      /* viewport corner marks */
}
/* one cut corner, opposite corners, used on every panel and control */
.cut{clip-path:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),
     calc(100% - var(--notch)) 100%,0 100%,0 var(--notch))}
.cut-sm{clip-path:polygon(var(--notch-sm) 0,100% 0,100% calc(100% - var(--notch-sm)),
     calc(100% - var(--notch-sm)) 100%,0 100%,0 var(--notch-sm))}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void)}
body{font-family:"Chakra Petch",system-ui,sans-serif;color:var(--ink);
     -webkit-font-smoothing:antialiased;line-height:1.45}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
/* Vignette only. The scanline overlay that used to sit here cost contrast on a
   canvas whose entire signal is dormant-vs-active brightness, and it read as a
   filter rather than as an instrument. */
#fx{position:fixed;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(6,8,12,.55) 100%)}
/* Corner marks on the viewport itself. Four short rules state the frame without
   boxing the map in, which is the whole trick of a HUD: imply the edge. */
#hud{position:fixed;inset:10px;pointer-events:none;z-index:5}
#hud i{position:absolute;width:26px;height:26px;border:1px solid var(--bracket)}
#hud i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
#hud i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
#hud i:nth-child(3){bottom:0;right:0;border-left:0;border-top:0}
#hud i:nth-child(4){bottom:0;left:0;border-right:0;border-top:0}
/* a thin tick rule down the left gutter — reads as an instrument scale */
#hud u{position:absolute;left:0;top:64px;bottom:64px;width:7px;
  background:repeating-linear-gradient(180deg,var(--bracket) 0 1px,transparent 1px 13px);
  opacity:.5}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---- overlays ---- */
.ov{position:fixed;z-index:6}
#brand{top:18px;left:20px}
#brand .eyebrow{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--cyan);opacity:.8;display:flex;align-items:center;gap:7px}
#brand .eyebrow::before{content:"[";color:var(--line-hot);font-size:13px;line-height:1}
#brand .eyebrow::after{content:"]";color:var(--line-hot);font-size:13px;line-height:1}
/* No chromatic aberration on the wordmark — at a glance it read as a rendering
   fault rather than a choice. The accent letterform carries the identity instead. */
#brand h1{font-size:38px;font-weight:700;letter-spacing:.012em;margin:1px 0 0;line-height:1;
  color:var(--ink)}
#brand h1 .d{color:var(--magenta)}
#brand .tag{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin-top:6px;padding:4px 9px;
  border-left:2px solid var(--magenta);background:linear-gradient(90deg,
  rgba(255,77,106,.10),transparent 70%);max-width:330px;line-height:1.7}
#brand .date{font-family:"JetBrains Mono",monospace;font-size:19px;margin-top:9px;color:var(--ink);
  display:inline-flex;align-items:center;gap:9px}
#brand .date::before{content:"";width:16px;height:1px;background:var(--line-hot)}
/* Chain key + filter. Lives inside #brand so it is never occluded by the rail and
   survives the panel being hidden — it is the only key to what the colours mean. */
#legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;max-width:320px}
#legend .row{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);padding:4px 8px;transition:.15s;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
#legend .row:hover{border-color:var(--line-hot);color:var(--ink)}
#legend .row.off{opacity:.38}
#legend .row.off i{background:transparent!important;box-shadow:none!important}
#legend .row.on{color:var(--ink)}
#legend .row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#legend i{width:7px;height:7px;border-radius:50%;flex:none;border:1px solid currentColor}
/* ---- derived narrative: the sentence a non-specialist came for ----
   Regenerated from the payload on every frame; never written by hand. */
#narrative{top:20px;left:372px;right:452px;text-align:center;pointer-events:none;
  font-size:13px;color:var(--muted);line-height:1.5;transition:opacity .2s}
#narrative b{color:var(--ink);font-weight:600}
#narrative .up{color:var(--in)} #narrative .dn{color:var(--out)}
#narrative em{font-style:normal;color:var(--faint)}

/* ---- credibility strip: what the map is worth, stated permanently ---- */
#creds{bottom:44px;left:20px;display:flex;gap:20px;align-items:flex-end}
#creds .c{display:flex;flex-direction:column;gap:2px;cursor:help;padding-left:9px;border-left:1px solid var(--line-hot)}
#creds .v{font-family:"JetBrains Mono",monospace;font-size:19px;color:var(--accent);
  line-height:1;font-variant-numeric:tabular-nums}
#creds .k{font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);max-width:92px;line-height:1.35}
#status{bottom:16px;left:20px;font-family:"JetBrains Mono",monospace;font-size:9.5px;
  letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
#hint{bottom:16px;right:20px;font-family:"JetBrains Mono",monospace;font-size:9px;
  letter-spacing:.12em;color:var(--faint);text-align:right;line-height:1.7}
#hint b{color:var(--muted);font-weight:400}

/* ---- right rail ---- */
#rail{top:0;right:0;bottom:0;width:302px;background:var(--panel);backdrop-filter:blur(9px);
  border-left:1px solid var(--line);padding:70px 0 118px;display:flex;flex-direction:column;
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  clip-path:polygon(22px 0,100% 0,100% 100%,0 100%,0 22px)}
/* device stamp in the rail's head gutter — the panel has 70px of clear space
   above the tabs, so it costs nothing and names the surface */
#rail::before{content:"ROTATION FEED";position:absolute;top:28px;left:16px;
  font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.34em;
  color:var(--faint);pointer-events:none}
#rail::after{content:"";position:absolute;top:46px;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,var(--line-hot),transparent);pointer-events:none}
#rail.hidden{transform:translateX(302px)}
#rail h2{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--cyan);margin:0 0 3px;padding:0 16px;font-weight:400}
#rail .note{font-size:11px;color:var(--faint);padding:0 16px 10px;margin:0}
#tabs{display:flex;gap:1px;background:var(--line);margin:0 0 12px;border-block:1px solid var(--line)}
#tabs button{flex:1;background:var(--panel-solid);border:0;color:var(--faint);cursor:pointer;
  font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:9px 1px;transition:.15s;white-space:nowrap}
#tabs button:hover{color:var(--muted)}
#tabs button.on{color:var(--cyan);background:var(--tab-on);box-shadow:inset 0 -2px 0 var(--cyan)}
#tabs button:focus-visible{outline:1px solid var(--cyan);outline-offset:-2px}
#search{margin:0 12px 10px;display:none}
#search input{width:100%;background:var(--field);border:1px solid var(--line-hot);color:var(--ink);
  font-family:"JetBrains Mono",monospace;font-size:12px;padding:8px 10px;outline:none}
#search input:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(61,214,208,.18)}
#search input::placeholder{color:var(--faint)}
.pane{display:none;flex:1;overflow-y:auto;overflow-x:hidden}
.pane.on{display:block}
#board{position:relative;height:100%}
.fl2{padding:7px 14px;border-bottom:1px solid var(--hair);font-family:"JetBrains Mono",monospace;
  font-size:11px;cursor:pointer}
.fl2:hover{background:var(--hover)}
.fl2 .p{display:flex;align-items:center;gap:6px;color:var(--ink)}
.fl2 .p em{font-style:normal;color:var(--faint)}
.fl2 .m{display:flex;justify-content:space-between;color:var(--faint);margin-top:2px;font-size:10px}
.fl2 .m b{color:var(--cyan);font-weight:400}
.mv{display:flex;align-items:center;gap:8px;padding:6px 14px;font-family:"JetBrains Mono",monospace;
  font-size:11px;border-bottom:1px solid var(--hair)}
.mv .sy{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .dl{flex:none}
.up{color:var(--in)} .dn{color:var(--out)}
/* ---- fresh inflow: new tokens taking capital from established names ---- */
.fr{padding:8px 14px;border-bottom:1px solid var(--hair);font-family:"JetBrains Mono",monospace;
  font-size:11px;cursor:pointer}
.fr:hover{background:var(--hover)}
.fr .t{display:flex;align-items:center;gap:7px}
.fr .t .sy{color:var(--accent);font-weight:700;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fr .age{font-size:9px;letter-spacing:.1em;color:var(--void);background:var(--accent);
  padding:1px 5px;flex:none;
  clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
.fr .m{display:flex;justify-content:space-between;gap:8px;color:var(--faint);
  margin-top:3px;font-size:10px}
.fr .m b{color:var(--muted);font-weight:400}
.fr .src{color:var(--in)}
#sres{padding:0 0 10px}
#sres .det{padding:10px 14px;font-family:"JetBrains Mono",monospace;font-size:11px}
#sres .det .h{font-size:14px;color:var(--accent);font-weight:700}
#sres .det .ch{color:var(--faint);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
#sres .det .r{display:flex;justify-content:space-between;color:var(--muted);margin-top:2px}
#sres .det .r b{color:var(--ink);font-weight:400}
#sres .det .lbl{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;margin:10px 0 3px}
#sres .det .lbl.i{color:var(--in)} #sres .det .lbl.o{color:var(--out)}
#sres .hit{padding:7px 14px;cursor:pointer;color:var(--muted);border-bottom:1px solid var(--hair);
  font-family:"JetBrains Mono",monospace;font-size:11.5px}
#sres .hit:hover{background:var(--hover);color:var(--ink)}
#speed{background:transparent;border:1px solid var(--line-hot);clip-path:polygon(var(--notch-sm) 0,100% 0,100% calc(100% - var(--notch-sm)),calc(100% - var(--notch-sm)) 100%,0 100%,0 var(--notch-sm));color:var(--muted);
  font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;padding:7px 9px;
  cursor:pointer;flex:none;transition:.15s;min-width:42px}
#speed:hover{background:var(--line);color:var(--cyan)}
#speed:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#date.paused::after{content:" ❚❚";font-size:11px;color:var(--accent);letter-spacing:.1em}
#board{position:relative;flex:1;overflow:hidden;margin:0 6px}
.rw{position:absolute;left:0;right:0;height:34px;display:flex;align-items:center;gap:8px;
  padding:0 10px;font-family:"JetBrains Mono",monospace;font-size:11.5px;
  transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .3s;will-change:transform}
.rw .rk{width:20px;color:var(--faint);font-size:10px;text-align:right;flex:none}
.rw .dt{width:7px;height:7px;border-radius:50%;flex:none}
.rw .sy{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .vl{color:var(--muted);flex:none}
.rw .ar{width:12px;font-size:9px;flex:none;text-align:center}
.rw.hot .sy{color:var(--accent);text-shadow:0 0 10px rgba(234,251,255,.5)}
#railToggle{position:fixed;z-index:7;top:18px;right:318px;background:var(--panel-solid);
  border:1px solid var(--line-hot);
  clip-path:polygon(var(--notch-sm) 0,100% 0,100% calc(100% - var(--notch-sm)),
    calc(100% - var(--notch-sm)) 100%,0 100%,0 var(--notch-sm));color:var(--cyan);font-family:"JetBrains Mono",monospace;
  font-size:10px;letter-spacing:.14em;padding:6px 11px;cursor:pointer;text-transform:uppercase;
  transition:right .32s cubic-bezier(.4,0,.2,1),background .15s}
#railToggle.out{right:20px}
#railToggle:hover{background:var(--line)}
#railToggle:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---- transport ---- */
#transport{bottom:44px;left:50%;transform:translateX(-50%);width:min(640px,calc(100vw - 420px));
  display:flex;align-items:center;gap:12px;background:var(--panel);backdrop-filter:blur(9px);
  border:1px solid var(--line);padding:10px 14px;transition:width .32s;
  clip-path:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),
    calc(100% - var(--notch)) 100%,0 100%,0 var(--notch))}
#transport.wide{width:min(760px,calc(100vw - 80px))}
#play{background:transparent;border:1px solid var(--line-hot);clip-path:polygon(var(--notch-sm) 0,100% 0,100% calc(100% - var(--notch-sm)),calc(100% - var(--notch-sm)) 100%,0 100%,0 var(--notch-sm));color:var(--cyan);
  font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.18em;padding:7px 12px;
  cursor:pointer;text-transform:uppercase;flex:none;transition:.15s}
#play:hover{background:var(--line);box-shadow:0 0 16px rgba(61,214,208,.22)}
#play:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#track{flex:1;position:relative;height:34px;cursor:grab;touch-action:none}
#track:active{cursor:grabbing}
#heat{position:absolute;top:6px;left:0;right:0;height:14px;opacity:.55}
#rail2{position:absolute;top:20px;left:0;right:0;height:2px;background:var(--line-hot)}
#fillbar{position:absolute;top:20px;left:0;height:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#headbar{position:absolute;top:12px;width:2px;height:18px;background:var(--accent);
  box-shadow:0 0 12px var(--accent);transform:translateX(-1px)}
#ticks{position:absolute;top:24px;left:0;right:0;height:12px}
#ticks b{position:absolute;font-family:"JetBrains Mono",monospace;font-size:8.5px;color:var(--faint);
  font-weight:400;transform:translateX(-50%);white-space:nowrap}

/* ---- hover card ---- */
#card{position:fixed;z-index:8;pointer-events:none;opacity:0;transition:opacity .11s;
  background:rgba(10,13,19,.97);border:1px solid var(--line-hot);padding:11px 13px;min-width:206px;
  clip-path:polygon(var(--notch-sm) 0,100% 0,100% calc(100% - var(--notch-sm)),
    calc(100% - var(--notch-sm)) 100%,0 100%,0 var(--notch-sm));
  max-width:250px;font-family:"JetBrains Mono",monospace;font-size:11px}
#card .h{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.05em}
#card .ch{color:var(--faint);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}
#card .r{display:flex;justify-content:space-between;gap:14px;color:var(--muted);margin-top:2px}
#card .r b{color:var(--ink);font-weight:400}
#card .sec{margin-top:9px;padding-top:7px;border-top:1px solid var(--line)}
#card .lbl{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:3px}
#card .lbl.i{color:var(--in)} #card .lbl.o{color:var(--out)}
#card .fl{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:10.5px}
#card .fl b{color:var(--ink);font-weight:400}

/* ---- boot ---- */
#boot{position:fixed;inset:0;z-index:20;background:var(--void);display:flex;align-items:center;
  justify-content:center;transition:opacity .45s}
#boot.done{opacity:0;pointer-events:none}
#bootlines{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--cyan);
  line-height:2;min-width:330px}
#bootlines div{opacity:0}
#bootlines div.on{opacity:1}
#bootlines span{color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------------------------------------------------------------------------
   Narrow screens. The rail becomes a bottom sheet rather than a side panel, and
   the map keeps the upper half of the viewport. Keyboard hints are dropped
   because there is no keyboard; everything they describe has a touch gesture.
   ------------------------------------------------------------------------- */
@media (max-width:860px){
  #brand{top:12px;left:14px;right:14px}
  #brand h1{font-size:30px}
  #brand .eyebrow,#brand .tag{font-size:8.5px;letter-spacing:.18em}
  #brand .date{font-size:16px;margin-top:5px}
  #legend{max-width:none;margin-top:9px}
  #hint{display:none}

  #rail{top:auto;left:0;right:0;bottom:0;width:auto;height:46vh;
    border-left:0;border-top:1px solid var(--line);padding:0 0 8px;
    transform:translateY(0)}
  #rail.hidden{transform:translateY(100%)}
  #board{height:560px;overflow:visible}
  .pane{overflow-y:auto;-webkit-overflow-scrolling:touch}

  #railToggle{top:auto;right:14px;bottom:calc(46vh + 10px);
    transition:bottom .32s cubic-bezier(.4,0,.2,1),background .15s}
  #railToggle.out{right:14px;bottom:14px}

  #transport{left:14px;right:14px;width:auto;transform:none;
    bottom:calc(46vh + 52px);transition:bottom .32s cubic-bezier(.4,0,.2,1)}
  #transport.wide{width:auto;bottom:56px}

  /* the sheet covers the bottom-left corner, and the run stats are repeated in
     the credibility strip — drop the duplicate rather than stack it underneath */
  #status{display:none}
  #card{max-width:min(250px,calc(100vw - 28px))}
  #tabs button{font-size:10px;letter-spacing:.1em;padding:12px 2px}
  /* the narrative and the numbers are the point — they stay, stacked under the
     brand where there is width for them, rather than floating over the map */
  #narrative{position:static;margin:11px 0 0;text-align:left;font-size:12px}
  #creds{position:static;margin:12px 0 0;gap:16px}
  #creds .v{font-size:16px}
  #creds .k{font-size:7.5px;max-width:78px}
}
@media (max-width:420px){
  #brand h1{font-size:25px}
  #rail,#railToggle,#transport{--sheet:52vh}
  #rail{height:52vh}
  #railToggle{bottom:calc(52vh + 10px)}
  #transport{bottom:calc(52vh + 52px);gap:8px}

/* ===========================================================================
   4. ENGINE — fixed layout, pannable camera, continuous time interpolation.
      Nodes never move in world space: scrubbing animates size/glow/edges only.
   ========================================================================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
const N=D.days.length, LAST=N-1, NODE={};
D.nodes.forEach(n=>NODE[n.id]=n);
const IN={}, OUT={};                       // adjacency for the hover card
D.edges.forEach(e=>{(OUT[e.a]=OUT[e.a]||[]).push(e);(IN[e.b]=IN[e.b]||[]).push(e);});

let W=0,H=0,dpr=1;
let targetT=LAST, curT=LAST, playing=false;
let hoverId=null, ripples=[], moshAmt=0;
/* shadowBlur is by far the most expensive canvas op — ~300 shadowed draws/frame was
   what stalled pan/zoom. GLOW drops to 0 while the user is interacting and eases
   back once things settle, so motion stays at 60fps and stillness stays pretty. */
let lastInteract=0, lastInput=0, GLOW=1;
/* `poke` means something is moving — the glow ducks for it, including during
   playback, which the frame loop drives through the same call. `input` means a
   hand is on the controls. The board keys off `input` alone: playback moves the
   map continuously, and a board that froze for the whole run would be reporting
   nothing at the moment it has the most to say. */
const poke=()=>{lastInteract=performance.now();};
const input=()=>{lastInput=performance.now();poke();};
const view={x:0,y:0,k:1, tx:0,ty:0,tk:1, vx:0,vy:0};   // current + target + pan velocity
const chainOn={}; D.chains.forEach(c=>chainOn[c]=true);

const lerp=(a,b,f)=>a+(b-a)*f, smooth=f=>f*f*(3-2*f);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function sample(arr,t){const i=clamp(Math.floor(t),0,LAST), j=Math.min(LAST,i+1);
  return lerp(arr[i],arr[j],smooth(t-i));}
const fmt=v=>v>=1e9?'$'+(v/1e9).toFixed(2)+'B':v>=1e6?'$'+(v/1e6).toFixed(1)+'M':
             v>=1e3?'$'+Math.round(v/1e3)+'k':'$'+Math.round(v);
const cc=c=>CONFIG.chain[c]||CONFIG.fallback;
const _cssv={};
const CSSV=v=>_cssv[v]||(_cssv[v]=getComputedStyle(document.documentElement).getPropertyValue(v).trim());
function mix(a,b,f){ // hex blend — chain hue at rest -> hot -> reserved accent
  const p=x=>[parseInt(x.slice(1,3),16),parseInt(x.slice(3,5),16),parseInt(x.slice(5,7),16)];
  const A=p(a),B=p(b);
  return `rgb(${Math.round(lerp(A[0],B[0],f))},${Math.round(lerp(A[1],B[1],f))},${Math.round(lerp(A[2],B[2],f))})`;
}
/* Canvas cannot read CSS variables, so resolve the THEME palette once here. Without
   this the engine hardcodes colours and the "edit THEME to restyle" contract is a lie. */
const VOID=CSSV('--void'), INK=CSSV('--ink'), ACCENT=CSSV('--accent'),
      GRID=CSSV('--grid'), HEAT=CSSV('--heat');
let MCMAX=1,USDMAX=1;
D.nodes.forEach(n=>{MCMAX=Math.max(MCMAX,...n.mc);USDMAX=Math.max(USDMAX,...n.usd);});
const rRing=v=>v<=0?0:CONFIG.ringMin+(CONFIG.ringMax-CONFIG.ringMin)*Math.sqrt(v/MCMAX);
const rCore=v=>v<=0?0:CONFIG.coreMin+(CONFIG.coreMax-CONFIG.coreMin)*Math.sqrt(v/USDMAX);

/* ---- camera ---- */
const BASE=()=>Math.min(W,H)*0.38;
const wx=x=>W/2+(x*BASE()+view.x)*view.k;      // world -> screen
const wy=y=>H/2+(y*BASE()+view.y)*view.k;
const sx=n=>wx(n.x);
const sy=n=>wy(n.y);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
/* Fit every node inside the *visible* area — the right rail covers part of the
   canvas, so the usable box is inset on that side and the camera centres on it. */
const MOBILE=()=>matchMedia('(max-width:860px)').matches;
/* horizontal extent of canvas the rail does not sit on top of */
const railOpen=()=>!rail.classList.contains('hidden');
let VIEWL=0, VIEWR=0;
function viewBox(){
  VIEWL=0;
  VIEWR=W-((railOpen()&&!MOBILE())?rail.offsetWidth:0);
}
function fit(animate){
  /* The rail eats width on desktop and height on mobile — inset whichever axis it
     actually covers, or the map centres itself underneath the panel. */
  const mob=MOBILE(), open=!rail.classList.contains('hidden');
  const railW = (open&&!mob) ? rail.offsetWidth  : 0;
  const railH = (open&&mob)  ? rail.offsetHeight : 0;
  const padL=34, padR=railW+34, padT=mob?152:118, padB=railH+(mob?28:104);
  const availW=Math.max(200,W-padL-padR), availH=Math.max(200,H-padT-padB);
  /* Bound the node CENTRES and add one modest world-space margin. Reserving each
     node's largest-ever ring over-shrinks the whole map for a handful of mega-caps. */
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const n of D.nodes){
    if(!shown(n))continue;
    x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);
    y0=Math.min(y0,n.y);y1=Math.max(y1,n.y);
  }
  if(x0>x1)return;
  const M=CONFIG.ringMax*0.55/BASE();              // one shared margin, not per-node
  x0-=M;x1+=M;y0-=M;y1+=M;
  const k=clamp(Math.min(availW/((x1-x0)*BASE()),availH/((y1-y0)*BASE()))*CONFIG.fitFill,
                CONFIG.zoomMin,CONFIG.zoomMax);
  const cx=(x0+x1)/2*BASE(), cy=(y0+y1)/2*BASE();
  const boxCx=padL+availW/2, boxCy=padT+availH/2;
  view.tk=k;
  view.tx=(boxCx-W/2)/k-cx;
  view.ty=(boxCy-H/2)/k-cy;
  if(!animate){view.k=view.tk;view.x=view.tx;view.y=view.ty;}
}
function reframe(){fit(true);}

/* ---- edge strength within the visible time window ---- */
function edgeAt(e,t){
  let best=0;const lo=Math.max(0,Math.floor(t)-CONFIG.edgeWindow),
                 hi=Math.min(LAST,Math.ceil(t)+CONFIG.edgeWindow);
  for(let i=lo;i<=hi;i++){const w=e.w[i];if(!w)continue;
    best=Math.max(best,w*Math.max(0,1-Math.abs(i-t)/(CONFIG.edgeWindow+1)));}
  return best;
}
const shown=n=>chainOn[n.chain];
/* ---- newly entered tokens, and capital arriving in them --------------------
   A position the cohort opened days ago, being fed by a name it has held for
   months, is the most actionable thing this map can show — and it is almost
   always small in absolute terms, so it is precisely what a top-N edge cap
   throws away: 387 of the 467 in this window fall below it, 83% of them, which
   research/scripts/fresh_inflows.py counts by replaying this selection frame by
   frame. They are drawn regardless. */
const ageAt=(n,t)=>t-n.first;
const isNew=(n,t)=>{const a=ageAt(n,t);return a>=0&&a<=CONFIG.newDays;};
/* The feeder has to be a name worth following, not merely an older one: capital
   leaving a top-ranked winner for a days-old position is the claim. */
const bigName=n=>n.rank<CONFIG.freshSourceRank;
const isFreshInflow=(e,t)=>isNew(NODE[e.b],t)&&!isNew(NODE[e.a],t)&&bigName(NODE[e.a]);
function freshInto(id,t){
  /* established feeders of one new token, strongest first */
  return (IN[id]||[]).map(e=>({s:NODE[e.a],w:edgeAt(e,t)}))
    .filter(r=>r.w>=CONFIG.freshMinShared&&!isNew(r.s,t)&&bigName(r.s))
    .sort((a,b)=>b.w-a.w);
}
function freshBoard(t){
  const out=[];
  for(const n of D.nodes){
    if(!shown(n)||!isNew(n,t))continue;
    const src=freshInto(n.id,t);
    if(!src.length)continue;
    /* weight the feeder's standing: capital leaving a proven name says more
       than the same wallets leaving another new one */
    const score=src.reduce((a,r)=>a+r.w*Math.log10(Math.max(10,r.s.peak)),0);
    out.push({n,src,score,age:Math.round(ageAt(n,t)),usd:sample(n.usd,t)});
  }
  return out.sort((a,b)=>b.score-a.score);
}
/* Draw order is by rank and never changes — sorting 80 nodes every frame was pure
   waste. Rebuilt only when a chain filter toggles. */
let ORDER=[];
const LABELS=[];                       // placed label boxes, one frame's worth
/* measureText is hot enough to matter at 60fps; symbol widths never change for a
   given size, and there are only a handful of sizes. */
const _tw=new Map();
function textW(txt,fs){
  const key=fs+'|'+txt;
  let w=_tw.get(key);
  if(w===undefined){w=ctx.measureText(txt).width;_tw.set(key,w);}
  return w;
}
function rebuildOrder(){ORDER=D.nodes.filter(shown).sort((a,b)=>b.rank-a.rank);rebuildHulls();}

/* ---- rotation neighbourhoods -------------------------------------------------
   Groups follow COMMUNITIES, not chains. Chain is already unambiguous from the
   colour and the chips; what colour cannot show is which tokens rotate as a
   pack, and several packs span more than one chain — which a chain-shaped
   layout could not have revealed.

   Drawn as corner brackets around a bounding box rather than as a filled hull.
   Communities interleave in space, and overlapping blobs turn into one
   unreadable shape, whereas brackets state an extent with almost no ink and
   stay legible stacked three deep. Positions are frozen, so the box is solved
   once in world space and only projected. */
const GROUPS={};
function rebuildHulls(){
  for(const k in GROUPS)delete GROUPS[k];
  const by={};
  for(const n of D.nodes){
    if(!shown(n)||n.comm==null)continue;
    (by[n.comm]=by[n.comm]||[]).push(n);
  }
  for(const c in by){
    const ns=by[c];
    if(ns.length<2)continue;                    // a lone token is not a neighbourhood
    const cx=ns.reduce((a,n)=>a+n.x,0)/ns.length, cy=ns.reduce((a,n)=>a+n.y,0)/ns.length;
    /* One stray member would stretch the box across the map and swallow its
       neighbours, so the frame is fitted to the core and outliers are simply
       left outside it — they still draw, they are just not claimed. */
    const dist=ns.map(n=>Math.hypot(n.x-cx,n.y-cy));
    const mean=dist.reduce((a,d)=>a+d,0)/dist.length || 1;
    const core=ns.filter((n,i)=>dist[i]<=mean*1.75);
    const fit=core.length>=2?core:ns;
    const anchor=ns.reduce((a,n)=>n.peak>a.peak?n:a,ns[0]);
    const tally={}; for(const n of ns)tally[n.chain]=(tally[n.chain]||0)+1;
    const chains=Object.keys(tally).sort((a,b)=>tally[b]-tally[a]);
    GROUPS[c]={n:ns.length,label:anchor.sym.slice(0,12),chain:chains[0],
               mixed:chains.length>1,
               x0:Math.min(...fit.map(n=>n.x)), x1:Math.max(...fit.map(n=>n.x)),
               y0:Math.min(...fit.map(n=>n.y)), y1:Math.max(...fit.map(n=>n.y))};
  }
}
function drawHulls(){
  const pad=CONFIG.groupPad*Math.min(1.5,view.k);
  const arm=CONFIG.groupArm*Math.min(1.5,view.k);      // bracket arm length
  const fs=clamp(9.5*Math.min(1.3,view.k),9,12);
  ctx.save();ctx.lineCap='square';
  ctx.font=`700 ${fs}px "JetBrains Mono",monospace`;
  for(const c in GROUPS){
    const g=GROUPS[c], col=cc(g.chain).hot;
    const x0=wx(g.x0)-pad, x1=wx(g.x1)+pad, y0=wy(g.y0)-pad, y1=wy(g.y1)+pad;
    if(x1<0||x0>W||y1<0||y0>H)continue;
    const w=x1-x0, h=y1-y0, a=Math.min(arm,w*0.34,h*0.34);

    ctx.globalAlpha=CONFIG.groupFill;ctx.fillStyle=col;
    ctx.fillRect(x0,y0,w,h);
    ctx.globalAlpha=CONFIG.groupLine;ctx.strokeStyle=col;ctx.lineWidth=1.25;
    ctx.beginPath();                                   // four corner brackets
    ctx.moveTo(x0,y0+a); ctx.lineTo(x0,y0); ctx.lineTo(x0+a,y0);
    ctx.moveTo(x1-a,y0); ctx.lineTo(x1,y0); ctx.lineTo(x1,y0+a);
    ctx.moveTo(x1,y1-a); ctx.lineTo(x1,y1); ctx.lineTo(x1-a,y1);
    ctx.moveTo(x0+a,y1); ctx.lineTo(x0,y1); ctx.lineTo(x0,y1-a);
    ctx.stroke();
    ctx.globalAlpha=CONFIG.groupLine*0.4;              // hairline edges between them
    ctx.setLineDash([2,7]);
    ctx.beginPath();
    ctx.moveTo(x0+a,y0);ctx.lineTo(x1-a,y0);
    ctx.moveTo(x0+a,y1);ctx.lineTo(x1-a,y1);
    ctx.moveTo(x0,y0+a);ctx.lineTo(x0,y1-a);
    ctx.moveTo(x1,y0+a);ctx.lineTo(x1,y1-a);
    ctx.stroke();ctx.setLineDash([]);

    /* label sits on the top rule, left-aligned, in the HUD manner */
    const txt=`${g.label} ·${g.n}${g.mixed?' ⁑':''}`, tw=textW(txt,fs);
    const lx=clamp(x0+a+6,VIEWL+6,Math.max(VIEWL+6,VIEWR-tw-6));
    const ly=clamp(y0-5,fs+4,H-8);
    ctx.globalAlpha=1;ctx.fillStyle=VOID;
    ctx.fillRect(lx-4,ly-fs+1,tw+8,fs+3);              // knock the rule out behind it
    ctx.globalAlpha=.85;ctx.fillStyle=col;ctx.textAlign='left';
    ctx.fillText(txt,lx,ly);
    LABELS.push([lx-4,ly-fs-1,lx+tw+4,ly+4]);
  }
  ctx.restore();
}

/* Edge selection depends only on (time, hover) — cache it between frames. */
let EDGE_CACHE={t:-1,h:null,list:[]};
function edgesFor(t){
  if(Math.abs(EDGE_CACHE.t-t)<0.02 && EDGE_CACHE.h===hoverId) return EDGE_CACHE.list;
  const live=[];
  for(const e of D.edges){
    const w=edgeAt(e,t);
    if(w<CONFIG.edgeMinShared) continue;
    if(!shown(NODE[e.a])||!shown(NODE[e.b])) continue;
    live.push({e,w});
  }
  live.sort((p,q)=>q.w-p.w);
  let list = hoverId ? live.filter(r=>r.e.a===hoverId||r.e.b===hoverId)
                     : live.slice(0,CONFIG.maxEdges);
  if(!hoverId){
    /* whatever the cap decided, capital arriving in a newly entered token gets
       drawn — that is the edge this product exists to surface */
    const seen=new Set(list.map(r=>r.e));
    const fresh=live.filter(r=>!seen.has(r.e)&&r.w>=CONFIG.freshMinShared
                               &&isFreshInflow(r.e,t)).slice(0,CONFIG.freshEdges);
    if(fresh.length)list=list.concat(fresh);
  }
  EDGE_CACHE={t,h:hoverId,list};
  return list;
}

function draw(t){
  ctx.fillStyle=VOID;ctx.fillRect(0,0,W,H);
  viewBox();
  const now=performance.now(), k=view.k;
  const settled=(now-lastInteract)>MOTION.idleMs;
  GLOW+=((settled?1:0)-GLOW)*(settled?0.10:0.45);
  const blur=(base,mult)=>GLOW<0.03?0:base*(mult===undefined?1:mult)*GLOW;
  /* grid drifts with the camera so panning feels anchored */
  ctx.save();ctx.strokeStyle=GRID;ctx.lineWidth=1;
  const gs=54*k, ox=(view.x*k)%gs, oy=(view.y*k)%gs;
  for(let x=ox%gs;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=oy%gs;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();

  LABELS.length=0;          // hull labels claim their boxes before any node label
  drawHulls();

  const rel=new Set();
  if(hoverId){rel.add(hoverId);
    (OUT[hoverId]||[]).forEach(e=>rel.add(e.b));(IN[hoverId]||[]).forEach(e=>rel.add(e.a));}
  const dim=id=>hoverId?(rel.has(id)?1:CONFIG.focusDim):1;

  /* ---------- rotations ---------- */
  const drawn=edgesFor(t);
  ctx.save();ctx.lineCap='round';
  for(const {e,w} of drawn){
    const a=NODE[e.a],b=NODE[e.b];
    const x1=sx(a),y1=sy(a),x2=sx(b),y2=sy(b);
    if(Math.max(x1,x2)<-80||Math.min(x1,x2)>W+80||Math.max(y1,y2)<-80||Math.min(y1,y2)>H+80)continue;
    const mx=(x1+x2)/2+(y2-y1)*.15, my=(y1+y2)/2-(x2-x1)*.15;
    const vis=Math.min(dim(e.a),dim(e.b));
    const alpha=Math.min(CONFIG.edgeMaxAlpha,w/7)*vis;
    /* when focused, colour by direction: green feeds in, red feeds out */
    /* While focused, direction beats chain identity: green feeds IN, red feeds OUT.
       The glow has to follow the same colour or it washes the coding out. */
    let g, glowCol=cc(b.chain).hot;
    const freshIn=isFreshInflow(e,t);
    if(hoverId===e.b){glowCol=CSSV('--in'); g=glowCol;}
    else if(hoverId===e.a){glowCol=CSSV('--out'); g=glowCol;}
    else if(freshIn){glowCol=ACCENT; g=ACCENT;}   // reserved colour, reserved meaning
    else{const lg=ctx.createLinearGradient(x1,y1,x2,y2);
      lg.addColorStop(0,cc(a.chain).hot);lg.addColorStop(1,cc(b.chain).hot);g=lg;}
    ctx.globalAlpha=freshIn?Math.min(0.9,alpha*1.7+0.18):alpha;ctx.strokeStyle=g;
    ctx.lineWidth=Math.min(3.2,(0.5+w*0.24))*Math.min(1.5,k)*(hoverId?1.25:1)*(freshIn?1.5:1);
    ctx.shadowBlur=blur(11*Math.min(1.4,k));ctx.shadowColor=glowCol;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();
    const nP=Math.min(4,1+Math.floor(w/3));
    for(let i=0;i<nP;i++){
      const p=((now*MOTION.particleRate*(0.7+w*0.05))+i/nP+e.a.length*0.07)%1;
      const q=1-p,bx=q*q*x1+2*q*p*mx+p*p*x2,by=q*q*y1+2*q*p*my+p*p*y2;
      ctx.globalAlpha=Math.min(1,alpha*2.5);ctx.fillStyle=glowCol;ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(bx,by,(1.7+w*.07)*Math.min(1.6,k),0,7);ctx.fill();
      /* a ripple marks a rotation landing — that one is informative, so it stays */
      if(p>0.97)ripples.push({x:x2,y:y2,c:cc(b.chain).hot,t0:now,r:rRing(sample(b.mc,t))*k});
    }
  }
  ctx.restore();
  ripples=ripples.filter(r=>now-r.t0<MOTION.rippleMs);
  ctx.save();
  for(const r of ripples){const f=(now-r.t0)/MOTION.rippleMs;
    ctx.globalAlpha=(1-f)*.45;ctx.strokeStyle=r.c;ctx.lineWidth=1.5;
    ctx.shadowBlur=blur(16);ctx.shadowColor=r.c;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r+f*30,0,7);ctx.stroke();}
  ctx.restore();

  /* ---------- nodes: biggest drawn last so they read on top ---------- */
  /* A phone shows the same map in a fraction of the area, so the same label count
     collides. Both thresholds tighten rather than shrinking the type below legible. */
  const mob=MOBILE();
  const budget=Math.round(CONFIG.labelBudget(k)*(mob?0.5:1));
  const labelMinPx=CONFIG.labelMinPx*(mob?1.7:1);
  /* Label type size is a function of zoom alone, so the font is set once per frame
     rather than per node. Setting ctx.font and calling measureText are both costly,
     and clustering puts far more labels on screen at high zoom than the old
     scatter did — enough to cost ~6ms/frame while zooming before this. */
  const labelFs=clamp(10*Math.min(1.35,k),9,14);
  ctx.font=`600 ${labelFs}px "Chakra Petch",sans-serif`;
  for(const n of ORDER){
    const mc=sample(n.mc,t), usd=sample(n.usd,t), act=sample(n.act,t);
    if(mc<=0&&usd<=0)continue;
    const born=clamp((t-n.first+1.2)/1.6,0,1); if(born<=0)continue;
    const x=sx(n),y=sy(n);
    const R=rRing(mc)*born*k, C=Math.min(R*.92,rCore(usd)*born*k);
    if(x<-R-40||x>W+R+40||y<-R-40||y>H+R+40){n._sx=null;continue;}
    const heat=Math.pow(Math.min(1,act*CONFIG.activeBoost),CONFIG.activeGamma);
    const A=(CONFIG.dormantAlpha+(1-CONFIG.dormantAlpha)*heat)*born*dim(n.id);
    const hot=hoverId===n.id;
    /* hue = chain identity; heat drives it toward the reserved accent */
    const col=mix(cc(n.chain).rest,cc(n.chain).hot,Math.min(1,heat*1.25));
    const core=heat>0.72?mix(cc(n.chain).hot,ACCENT,(heat-0.72)/0.28):col;
    ctx.save();
    ctx.globalAlpha=.92*A;ctx.strokeStyle=col;ctx.lineWidth=(hot?2.3:1.25)*Math.min(1.6,k);
    const bigEnough=R>=CONFIG.glowMinPx;
    ctx.shadowBlur=bigEnough?blur(CONFIG.glow.ring*(hot?1.8:heat),Math.min(1.5,k)):0;
    ctx.shadowColor=col;
    ctx.beginPath();ctx.arc(x,y,Math.max(.8,R),0,7);ctx.stroke();
    if(C>.6){
      ctx.globalAlpha=.30*A;ctx.fillStyle=core;
      ctx.shadowBlur=bigEnough?blur(CONFIG.glow.core*heat):0;
      ctx.beginPath();ctx.arc(x,y,C,0,7);ctx.fill();
      ctx.globalAlpha=.88*A;ctx.beginPath();ctx.arc(x,y,C*.42,0,7);ctx.fill();
    }
    /* Newly entered tokens carry a HUD bracket and their age. One being fed by
       an established name is the signal itself, so it also gets the reserved
       accent and a tag — a small position can still be the loudest thing here. */
    if(isNew(n,t)&&born>0.5){
      const fed=freshInto(n.id,t).length>0;
      const mr=Math.max(R,7)+7, br=mr*0.52;
      ctx.globalAlpha=(fed?0.95:0.45)*dim(n.id);
      ctx.strokeStyle=fed?ACCENT:col;ctx.lineWidth=fed?1.5:1;
      ctx.shadowBlur=fed?blur(9):0;ctx.shadowColor=ACCENT;
      ctx.beginPath();
      ctx.moveTo(x-mr,y-mr+br);ctx.lineTo(x-mr,y-mr);ctx.lineTo(x-mr+br,y-mr);
      ctx.moveTo(x+mr-br,y-mr);ctx.lineTo(x+mr,y-mr);ctx.lineTo(x+mr,y-mr+br);
      ctx.moveTo(x+mr,y+mr-br);ctx.lineTo(x+mr,y+mr);ctx.lineTo(x+mr-br,y+mr);
      ctx.moveTo(x-mr+br,y+mr);ctx.lineTo(x-mr,y+mr);ctx.lineTo(x-mr,y+mr-br);
      ctx.stroke();ctx.shadowBlur=0;
      if(fed&&R>=5){
        const tag=`NEW ${Math.max(0,Math.round(ageAt(n,t)))}D`;
        ctx.font=`700 9px "JetBrains Mono",monospace`;
        const tw=textW(tag,9);
        ctx.globalAlpha=dim(n.id);ctx.fillStyle=ACCENT;
        ctx.fillRect(x-tw/2-4,y-mr-14,tw+8,11);
        ctx.fillStyle=VOID;ctx.textAlign='center';
        ctx.fillText(tag,x,y-mr-5.5);
        ctx.font=`600 ${labelFs}px "Chakra Petch",sans-serif`;   // restore label font
      }
    }
    if(hot||n.rank<budget||R>=labelMinPx){
      const fs=labelFs;
      const txt=n.sym.slice(0,14);
      const ly=(n.sym.charCodeAt(0)%2)?y+R+13:y-R-6;
      /* Clustering packs tokens tight, so unplaced labels used to stack into an
         unreadable pile. Highest-ranked wins the spot; the rest are dropped and
         are still reachable by hover, search, or zooming in. */
      const hw=textW(txt,fs)/2+3, box=[x-hw,ly-fs-2,x+hw,ly+5];
      let clash=false;
      if(!hot)for(const b of LABELS){
        if(box[0]<b[2]&&box[2]>b[0]&&box[1]<b[3]&&box[3]>b[1]){clash=true;break;}
      }
      if(!clash){
        LABELS.push(box);
        ctx.globalAlpha=Math.min(1,born*dim(n.id)*(hot?1:.5+heat*.5));
        ctx.shadowBlur=blur(7);ctx.shadowColor=VOID;ctx.fillStyle=hot?ACCENT:INK;
        ctx.textAlign='center';
        ctx.fillText(txt,x,ly);
      }
    }
    ctx.restore();
    n._sx=x;n._sy=y;n._sr=Math.max(R,10);
  }

  /* ---------- datamosh: RGB split driven by scrub velocity ---------- */
  if(moshAmt>0.4){
    const off=Math.min(MOTION.moshMax,moshAmt*MOTION.moshGain);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.30;
    ctx.drawImage(cv,-off*dpr,0,cv.width,cv.height,-off,0,W,H);
    ctx.globalAlpha=.22;
    ctx.drawImage(cv, off*dpr,0,cv.width,cv.height, off,0,W,H);
    ctx.restore();
  }
  /* The scanline tear that used to fire here displaced whatever it cut through —
     token labels, chain labels, bubbles — at random moments, which made the map
     look mis-rendered and made screenshots non-deterministic. Rotations landing
     are already marked by the ripples above, which move nothing.
  */
  paintHUD(t);
  paintRail(t);
}
/* ===========================================================================
   DERIVED NARRATIVE — the one sentence a non-specialist came for.
   Every clause is computed from the payload; none of it is written by hand.
   Wording tracks the primitive exactly: `usd` is the cohort's value_usd, which
   carries price drift, so this says "cohort capital", never "bought".
   ========================================================================= */
const WINDOW=7;
const credsEl=document.getElementById('creds'), narrEl=document.getElementById('narrative');
/* The masthead states the claim, not a mood. Both lines are read from the payload
   so they cannot drift from research/claims.json. */
document.getElementById('eyebrow').textContent=
  `Nansen · ${D.stats.cohort.toLocaleString()} repeat winners · ${D.chains.length} chains`;
/* The headline sentence lives with the number in claims.json, so its scope cannot
   drift from what was measured — an unscoped "78% of winners" would read as a
   cross-chain result, which is not what the run says. */
document.getElementById('tag').textContent = D.claims.oot.headline ||
  `${D.claims.oot.value}% of the next month's winners were already on this map`;
credsEl.innerHTML=Object.keys(D.claims||{}).map(k=>{
  const c=D.claims[k];
  return `<div class="c" title="${c.scope.replace(/"/g,'&quot;')}${c.detail?' ('+c.detail+')':''}">`+
         `<span class="v">${c.value}${c.unit==='x'?'×':c.unit==='days'?'d':c.unit}</span>`+
         `<span class="k">${c.label}</span></div>`;}).join('');

let narrCache={t:-99,html:''};
function narrativeAt(t){
  const back=Math.max(0,t-WINDOW);
  const byChain={};
  for(const n of D.nodes){
    if(!shown(n))continue;
    byChain[n.chain]=(byChain[n.chain]||0)+(sample(n.usd,t)-sample(n.usd,back));
  }
  const moves=Object.entries(byChain).sort((a,b)=>b[1]-a[1]);
  if(!moves.length)return '';
  const [gC,gV]=moves[0], [lC,lV]=moves[moves.length-1];

  /* a position is "new" only if the cohort first took it inside this window */
  const fresh=D.nodes.filter(n=>shown(n)&&n.first>back&&n.first<=t&&sample(n.usd,t)>0)
                     .sort((a,b)=>sample(b.usd,t)-sample(a.usd,t))[0];

  let head;
  if(moves.length>1&&gV>0&&lV<0)
    head=`cohort capital in <b>${gC}</b> <span class="up">+${fmt(gV)}</span>, `+
         `<b>${lC}</b> <span class="dn">−${fmt(-lV)}</span>`;
  else if(gV>0)
    head=`cohort capital in <b>${gC}</b> <span class="up">+${fmt(gV)}</span>`;
  else
    head=`cohort capital in <b>${lC}</b> <span class="dn">−${fmt(-lV)}</span>`;

  let tail='';
  if(fresh){
    tail=` · largest new position <b>${fresh.sym}</b> `+
         `${fmt(sample(fresh.usd,t))} across ${Math.round(sample(fresh.wal,t))} wallets`;
  }else{
    const top=edgesFor(t)[0];
    if(top)tail=` · biggest rotation <b>${NODE[top.e.a].sym}</b> → `+
                `<b>${NODE[top.e.b].sym}</b>, ${Math.round(top.w)} shared wallets`;
  }
  const d=D.days[clamp(Math.round(t),0,LAST)];
  return `<em>${WINDOW} days to ${d}</em> — ${head}${tail}`;
}
function paintNarrative(t){
  if(Math.abs(narrCache.t-t)<0.35)return;
  narrCache.t=t;
  const html=narrativeAt(t);
  if(html!==narrCache.html){narrCache.html=html;narrEl.innerHTML=html;}
}

function paintHUD(t){
  const i=clamp(Math.round(t),0,LAST);
  document.getElementById('date').textContent=D.days[i];
  document.getElementById('status').textContent=
    `${D.stats.cohort} wallets · ${D.nodes.length} tokens · frame ${i+1}/${N}`+
    `${D.stats.built?` · built ${D.stats.built}`:''}`;
  paintNarrative(t);
  const p=t/LAST*100;
  document.getElementById('headbar').style.left=p+'%';
  document.getElementById('fillbar').style.width=p+'%';
  document.getElementById('track').setAttribute('aria-valuenow',Math.round(p));
}

/* ---- main loop ----
   Every constant in MOTION is a per-frame fraction, which quietly tied the whole
   feel to the display: measured on a 120Hz panel, the month played at 18 days a
   second against the 9 it was tuned for, and every ease settled in half the time.
   `f` is this frame's length in 60Hz frames, so a build behaves identically at
   60, 120 or 144Hz — and on a high-refresh screen it also halves how often the
   board reorders, which is the one piece of DOM here that costs frames. Clamped
   at both ends: a backgrounded tab comes back with a delta of seconds. */
const STEP=1000/60;
let lastT=LAST, prevTs=performance.now();
function frame(ts){
  const now=ts||performance.now();
  const f=clamp((now-prevTs)/STEP,0.2,3); prevTs=now;
  /* a per-frame fraction e, re-expressed for a frame f times as long */
  const ease=e=>1-Math.pow(1-e,f);
  if(playing){targetT+=MOTION.playSpeed*rate()*f;if(targetT>LAST){targetT=LAST;setPlay(false);}}
  curT+=(targetT-curT)*ease(MOTION.scrubEase);
  if(Math.abs(targetT-curT)<0.0004)curT=targetT;
  moshAmt=moshAmt*Math.pow(0.82,f)+Math.abs(curT-lastT)*0.9; lastT=curT;
  if(moshAmt>0.35||Math.abs(view.tk-view.k)>0.002||Math.abs(view.vx)+Math.abs(view.vy)>0.4)poke();
  if(!dragging){view.tx+=view.vx*f;view.ty+=view.vy*f;
    const fr=Math.pow(MOTION.panFriction,f); view.vx*=fr; view.vy*=fr;}
  const z=ease(MOTION.zoomEase);
  view.x+=(view.tx-view.x)*z;
  view.y+=(view.ty-view.y)*z;
  view.k+=(view.tk-view.k)*z;
  draw(curT);
  requestAnimationFrame(frame);
}

/* ===========================================================================
   5. INTERACTION — pan, zoom, hover, transport
   ========================================================================= */
let dragging=false,px0=0,py0=0,moved=0;
/* Touch needs two things a mouse gets for free: pinch (there is no wheel) and
   tap-to-inspect (there is no hover). Pointer events cover both without a
   separate touch path — PTRS tracks how many are down. */
const PTRS=new Map(); let pinchD=0;
const twoPts=()=>{const a=[...PTRS.values()];return a.length>=2?[a[0],a[1]]:null;};
function pinchMove(){
  const p=twoPts(); if(!p)return;
  const d=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);
  if(!pinchD||!d){pinchD=d;return;}
  const k0=view.tk, k1=clamp(k0*(d/pinchD),CONFIG.zoomMin,CONFIG.zoomMax);
  const mx=(p[0].x+p[1].x)/2-W/2, my=(p[0].y+p[1].y)/2-H/2;
  view.tx-=mx*(1/k0-1/k1); view.ty-=my*(1/k0-1/k1);
  view.tk=k1; pinchD=d; input(); hideCard();
}
cv.addEventListener('pointerdown',e=>{
  PTRS.set(e.pointerId,{x:e.clientX,y:e.clientY});
  cv.setPointerCapture(e.pointerId);
  if(PTRS.size>=2){                       // second finger down: pan becomes pinch
    dragging=false;cv.classList.remove('drag');
    const p=twoPts(); pinchD=p?Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y):0;
    return;
  }
  dragging=true;moved=0;input();px0=e.clientX;py0=e.clientY;
  view.vx=view.vy=0;cv.classList.add('drag');});
cv.addEventListener('pointermove',e=>{
  if(PTRS.has(e.pointerId))PTRS.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PTRS.size>=2){pinchMove();return;}
  if(dragging){
    const dx=(e.clientX-px0)/view.k, dy=(e.clientY-py0)/view.k;
    view.tx+=dx;view.ty+=dy;view.x+=dx;view.y+=dy;
    view.vx=dx*0.85;view.vy=dy*0.85;moved+=Math.abs(dx)+Math.abs(dy);input();
    px0=e.clientX;py0=e.clientY;hideCard();return;
  }
  hoverTest(e.clientX,e.clientY);
});
function endPointer(e){
  const wasDragging=dragging, tapped=PTRS.size===1&&moved<6;
  PTRS.delete(e.pointerId);
  if(PTRS.size<2)pinchD=0;
  if(PTRS.size===0){
    dragging=false;cv.classList.remove('drag');
    /* a tap that did not pan is an inspect gesture — the touch stand-in for hover */
    if(wasDragging&&tapped&&e.clientX!=null)hoverTest(e.clientX,e.clientY);
  }
}
addEventListener('pointerup',endPointer);
addEventListener('pointercancel',endPointer);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){hoverId=null;hideCard();}});
cv.addEventListener('wheel',e=>{
  e.preventDefault();input();
  const k0=view.tk, k1=clamp(k0*(e.deltaY<0?1.14:0.877),CONFIG.zoomMin,CONFIG.zoomMax);
  /* zoom toward the cursor, not the centre */
  const mx=e.clientX-W/2, my=e.clientY-H/2;
  view.tx-=mx*(1/k0-1/k1); view.ty-=my*(1/k0-1/k1);
  view.tk=k1;
},{passive:false});

const card=document.getElementById('card');
const hideCard=()=>{card.style.opacity=0;};
function hoverTest(mx,my){
  let best=null,bd=1e9;
  for(const n of D.nodes){
    if(n._sx==null||!shown(n))continue;
    const d=Math.hypot(mx-n._sx,my-n._sy);
    if(d<n._sr&&d<bd){bd=d;best=n;}
  }
  hoverId=best?best.id:null;
  if(!best){hideCard();return;}
  const t=curT;
  const rows=(arr,key)=>(arr||[]).map(e=>({s:NODE[key==='a'?e.a:e.b],w:edgeAt(e,t)}))
    .filter(r=>r.w>=CONFIG.edgeMinShared).sort((a,b)=>b.w-a.w).slice(0,4);
  const fedBy=rows(IN[best.id],'a'), feeding=rows(OUT[best.id],'b');
  const sec=(lbl,cls,list)=>list.length?`<div class="sec"><div class="lbl ${cls}">${lbl}</div>`+
    list.map(r=>`<div class="fl"><span>${r.s.sym.slice(0,13)}</span><b>${Math.round(r.w)}w</b></div>`).join('')+
    `</div>`:'';
  card.innerHTML=`<div class="h">${best.sym}</div><div class="ch">${best.chain}</div>
    <div class="r"><span>market cap</span><b>${fmt(sample(best.mc,t))}</b></div>
    <div class="r"><span>cohort capital</span><b>${fmt(sample(best.usd,t))}</b></div>
    <div class="r"><span>wallets in</span><b>${Math.round(sample(best.wal,t))}</b></div>
    <div class="r"><span>first seen</span><b>${D.days[best.first]}</b></div>
    ${sec('Fed by','i',fedBy)}${sec('Feeding','o',feeding)}`;
  card.style.opacity=1;
  card.style.left=Math.min(W-262,mx+18)+'px';
  card.style.top=clamp(my-12,8,H-190)+'px';
}

/* transport */
const track=document.getElementById('track'), playBtn=document.getElementById('play'),
      speedBtn=document.getElementById('speed'), dateEl=document.getElementById('date');
function absT(cx){const r=track.getBoundingClientRect();
  return clamp((cx-r.left)/r.width*LAST,0,LAST);}
let sdrag=false, dragX0=0, dragT0=0;
track.addEventListener('pointerdown',e=>{
  sdrag=true;track.setPointerCapture(e.pointerId);setPlay(false);
  targetT=absT(e.clientX);            // click still jumps straight to the spot
  dragX0=e.clientX;dragT0=targetT;e.stopPropagation();});
track.addEventListener('pointermove',e=>{
  if(!sdrag)return;
  /* relative drag with gain < 1 so fine adjustment is possible */
  const r=track.getBoundingClientRect();
  targetT=clamp(dragT0+((e.clientX-dragX0)/r.width)*LAST*MOTION.scrubGain,0,LAST);
  input(); e.stopPropagation();});
addEventListener('pointerup',()=>{if(sdrag){sdrag=false;snapDate();}});

/* ---------- (3) playback speed ---------- */
let speedIx=1;                                   // index into CONFIG.speeds
const rate=()=>CONFIG.speeds[speedIx];
speedBtn.addEventListener('click',()=>{
  speedIx=(speedIx+1)%CONFIG.speeds.length;
  speedBtn.textContent=rate()+'×';});

/* ---------- (4) land on an exact day whenever playback stops ---------- */
let everPlayed=false;
function snapDate(){targetT=clamp(Math.round(targetT),0,LAST);}
function setPlay(v){
  playing=v;playBtn.textContent=v?'❚❚ Pause':'▶ Play';
  if(v){everPlayed=true;if(targetT>=LAST)targetT=0;}
  else snapDate();
  dateEl.classList.toggle('paused',!v&&everPlayed);
}
playBtn.addEventListener('click',()=>setPlay(!playing));
/* Single-key shortcuts must not fire while the user is typing: searching for
   HOOKR would otherwise hide the panel on the H and reframe the map on the R.
   Escape leaves the field so the shortcuts come back without reaching for the mouse. */
const typing=el=>!!el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable);
addEventListener('keydown',e=>{
  if(typing(e.target)){
    if(e.key==='Escape'){e.target.blur();}
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey)return;      // leave browser shortcuts alone
  if(e.key===' '){setPlay(!playing);e.preventDefault();}
  if(e.key==='ArrowRight'){setPlay(false);targetT=Math.min(LAST,Math.round(targetT)+1);}
  if(e.key==='ArrowLeft'){setPlay(false);targetT=Math.max(0,Math.round(targetT)-1);}
  if(e.key==='/'){e.preventDefault();showPane('find');document.getElementById('q').focus();}
  if(e.key==='r'||e.key==='R')reframe();
  if(e.key==='h'||e.key==='H')toggleRail();
});

/* Chain key, which doubles as the filter. Rendered as buttons so it is reachable by
   keyboard, and carries each chain's token count — the 40x spread across chains is the

const legend=document.getElementById('legend');

/* Repeat-winner rate per chain is the ceiling on whether a cohort can work there at
   all, and it is the finding that explains why one territory carries the map. It
   rides the chip rather than a panel of its own — the colour and its caveat in the
   same place, costing no screen. */

const chainTitle=c=>{
  const r=PERSIST[c]; if(!r)return `${c}: ${chainCount[c]||0} tokens`;
  return `${c} — ${r.rate}% repeat-winner rate (${r.repeat} of ${r.traders.toLocaleString()} `+
         `winning traders won more than once)`+
         (r.covtot?`. Out-of-time coverage ${r.cov}/${r.covtot}.`:'.')+
         (r.rate<4?' Below the ~4% floor, a cohort has no headroom here.':'');
};
legend.innerHTML=D.chains.map(c=>
  `<button type="button" class="row on" data-c="${c}" aria-pressed="true" `+

legend.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>{
  const c=r.dataset.c;

/* ticks + activity heat strip */
document.getElementById('ticks').innerHTML=[0,.25,.5,.75,1]
  .map(f=>{const i=Math.round(f*LAST);
    return `<b style="left:${f*100}%">${D.days[i].slice(5)}</b>`;}).join('');
(function heat(){
  const c=document.getElementById('heat');
  function paint(){const w=track.clientWidth||520;c.width=w*2;c.height=28;c.style.width=w+'px';
    const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
    const tot=D.days.map((_,i)=>D.nodes.reduce((a,n)=>a+(n.act[i]||0),0));
    const mx=Math.max(...tot)||1;
    for(let i=0;i<N;i++){const h=(tot[i]/mx)*28;
      g.fillStyle=`rgba(${HEAT},${0.2+0.7*tot[i]/mx})`;
      g.fillRect(i/N*c.width,28-h,Math.max(1,c.width/N-1),h);}}
  paint();addEventListener('resize',()=>setTimeout(paint,60));
})();

/* ===========================================================================
   RAIL — four panes: Rank, Flows, Movers, Search. Only the active one paints.
   ========================================================================= */
const board=document.getElementById('board'), ROWS={};

             move:document.getElementById('p-move'),find:document.getElementById('p-find'),
             fresh:document.getElementById('p-fresh')};

const NOTES={rank:'Cohort capital, reordering as you scrub.',
             flow:'Shared wallets reducing one token while increasing another.',
             move:'7-day change in cohort capital at this frame.',
             fresh:'Tokens the cohort has just entered, and the established names funding them.',
             find:'Find a token and see what it feeds, and what feeds it.'};
let pane='rank', lastPaint=0;
function showPane(p){
  pane=p;

document.querySelectorAll('#tabs button').forEach(b=>
  b.addEventListener('click',()=>showPane(b.dataset.p)));

/* focus a token from any list: highlight it and centre the camera on it */
function focusToken(id){
  const n=NODE[id]; if(!n)return;
  hoverId=id;
  view.tx=-n.x*BASE(); view.ty=-n.y*BASE();
  view.tk=clamp(Math.max(view.tk,1.35),CONFIG.zoomMin,CONFIG.zoomMax);
  input();
}
function flowsAt(t){
  const live=[];
  for(const e of D.edges){
    const w=edgeAt(e,t);
    if(w>=CONFIG.edgeMinShared&&shown(NODE[e.a])&&shown(NODE[e.b])) live.push({e,w});
  }
  return live.sort((a,b)=>b.w-a.w);
}
function paintRank(t){
  const rank=D.nodes.filter(shown).map(n=>({n,usd:sample(n.usd,t),act:sample(n.act,t)}))
    .filter(r=>r.usd>1000).sort((a,b)=>b.usd-a.usd).slice(0,16);
  const seen=new Set();
  rank.forEach((r,i)=>{
    seen.add(r.n.id);
    let el=ROWS[r.n.id];
    if(!el){
      el=document.createElement('div');el.className='rw';
      el.innerHTML=`<span class="rk"></span><span class="dt" style="background:${cc(r.n.chain).hot}"></span>`+
        `<span class="sy">${r.n.sym.slice(0,15)}</span><span class="vl"></span><span class="ar"></span>`;
      el.addEventListener('click',()=>focusToken(r.n.id));
      el.style.cursor='pointer';
      board.appendChild(el);ROWS[r.n.id]=el;el._p=i;
    }
    el.style.transform=`translateY(${i*34}px)`;el.style.opacity=1;
    el.querySelector('.rk').textContent=i+1;
    el.querySelector('.vl').textContent=fmt(r.usd);
    const d=el._p-i; el._p=i;
    const ar=el.querySelector('.ar');
    ar.textContent=d>0?'▲':d<0?'▼':'';
    ar.style.color=d>0?'var(--in)':d<0?'var(--out)':'transparent';
    el.classList.toggle('hot',r.act>0.45);
  });
  for(const id in ROWS) if(!seen.has(id)){ROWS[id].style.opacity=0;ROWS[id].style.transform='translateY(600px)';}
}
function paintFlow(t){
  const live=flowsAt(t).slice(0,14);
  panes.flow.innerHTML = live.length ? live.map(({e,w})=>{
    const a=NODE[e.a],b=NODE[e.b];
    return `<div class="fl2" data-id="${e.b}">
      <div class="p"><span style="color:${cc(a.chain).hot}">${a.sym.slice(0,12)}</span>
      <em>→</em><span style="color:${cc(b.chain).hot}">${b.sym.slice(0,12)}</span></div>
      <div class="m"><span>${a.chain} → ${b.chain}</span><b>${Math.round(w)} wallets</b></div></div>`;
  }).join('') : '<div class="fl2"><div class="m">no rotations in this window</div></div>';
  panes.flow.querySelectorAll('.fl2[data-id]').forEach(el=>
    el.addEventListener('click',()=>focusToken(el.dataset.id)));
}
function paintMove(t){
  const back=Math.max(0,t-7);
  const rows=D.nodes.filter(shown).map(n=>{
    const now=sample(n.usd,t), then=sample(n.usd,back);
    return {n,now,delta:now-then,pct:then>500?(now/then-1)*100:(now>500?999:0)};
  }).filter(r=>Math.abs(r.delta)>2000).sort((a,b)=>b.delta-a.delta);
  const top=rows.slice(0,8), bot=rows.slice(-6).reverse();
  const row=r=>`<div class="mv" data-id="${r.n.id}">
    <span class="dt" style="background:${cc(r.n.chain).hot};width:7px;height:7px;border-radius:50%"></span>
    <span class="sy">${r.n.sym.slice(0,13)}</span>
    <span class="dl ${r.delta>0?'up':'dn'}">${r.delta>0?'+':''}${fmt(Math.abs(r.delta))}</span></div>`;
  panes.move.innerHTML =
    `<div class="fl2" style="cursor:default"><div class="m"><b>GAINING</b></div></div>`+top.map(row).join('')+
    `<div class="fl2" style="cursor:default;margin-top:6px"><div class="m"><b style="color:var(--out)">BLEEDING</b></div></div>`+bot.map(row).join('');
  panes.move.querySelectorAll('.mv[data-id]').forEach(el=>
    el.addEventListener('click',()=>focusToken(el.dataset.id)));
}
function paintFresh(t){
  const rows=freshBoard(t).slice(0,14);
  panes.fresh.innerHTML = rows.length ? rows.map(r=>{
    const feeders=r.src.slice(0,3).map(f=>f.s.sym.slice(0,10)).join(', ');
    return `<div class="fr" data-id="${r.n.id}">
      <div class="t"><span class="dt" style="background:${cc(r.n.chain).hot};width:7px;height:7px;
        border-radius:50%"></span><span class="sy">${r.n.sym.slice(0,14)}</span>
        <span class="age">NEW ${r.age}D</span></div>
      <div class="m"><span>fed by <b class="src">${feeders}</b></span>
        <span><b>${Math.round(r.src.reduce((a,f)=>a+f.w,0))}w</b> · ${fmt(r.usd)}</span></div>
    </div>`;}).join('')
    : '<div class="fr" style="cursor:default"><div class="m">'+
      'No established name is feeding a new position in this window.</div></div>';
  panes.fresh.querySelectorAll('.fr[data-id]').forEach(el=>
    el.addEventListener('click',()=>focusToken(el.dataset.id)));
}

/* ---------- (1) search ---------- */
let query='', picked=null;
/* Centring the map is a response to the click. It used to be re-run by every
   repaint of this pane, which pinned the map in its interacting state — glow off,
   camera dragged back to the token eight times a second. */
function pick(id){picked=id;focusToken(id);paintRail(curT,true);}
const qEl=document.getElementById('q');
qEl.addEventListener('input',()=>{query=qEl.value.trim().toLowerCase();picked=null;paintRail(curT,true);});
function paintFind(t){
  const host=document.getElementById('sres');
  if(picked&&NODE[picked]){
    const n=NODE[picked];
    const rows=(arr,key)=>(arr||[]).map(e=>({s:NODE[key==='a'?e.a:e.b],w:edgeAt(e,t)}))
      .filter(r=>r.w>=CONFIG.edgeMinShared).sort((a,b)=>b.w-a.w).slice(0,6);
    const sec=(lbl,cls,list)=>list.length?`<div class="lbl ${cls}">${lbl}</div>`+
      list.map(r=>`<div class="r" data-id="${r.s.id}" style="cursor:pointer"><span>${r.s.sym.slice(0,14)}</span><b>${Math.round(r.w)}w</b></div>`).join(''):
      `<div class="lbl ${cls}">${lbl}</div><div class="r"><span>none in window</span></div>`;
    host.innerHTML=`<div class="det"><div class="h">${n.sym}</div><div class="ch">${n.chain}</div>
      <div class="r"><span>market cap</span><b>${fmt(sample(n.mc,t))}</b></div>
      <div class="r"><span>cohort capital</span><b>${fmt(sample(n.usd,t))}</b></div>
      <div class="r"><span>wallets in</span><b>${Math.round(sample(n.wal,t))}</b></div>
      <div class="r"><span>first seen</span><b>${D.days[n.first]}</b></div>
      <div class="r"><span>peak cohort</span><b>${fmt(n.peak)}</b></div>
      ${sec('Fed by','i',rows(IN[n.id],'a'))}${sec('Feeding','o',rows(OUT[n.id],'b'))}</div>`;
    host.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>pick(el.dataset.id)));
    return;
  }
  const hits=D.nodes.filter(n=>!query||n.sym.toLowerCase().includes(query))
    .sort((a,b)=>b.peak-a.peak).slice(0,24);
  host.innerHTML=hits.length?hits.map(n=>
    `<div class="hit" data-id="${n.id}"><span style="color:${cc(n.chain).hot}">●</span> ${n.sym} <span style="color:var(--faint)">${fmt(n.peak)}</span></div>`).join('')
    :'<div class="hit">no match</div>';
  host.querySelectorAll('.hit[data-id]').forEach(el=>el.addEventListener('click',()=>pick(el.dataset.id)));
}
/* The board is the only part of the HUD built from DOM, and relaying out sixteen
   reordering rows costs more than the whole canvas does. Profiling a fast scrub put
   every dropped frame here and nowhere else: holding it took the 99th-percentile
   frame from 50ms to 9ms, while the canvas, the edge rescan and the datamosh each
   measured as noise. It is unreadable mid-drag anyway — sixteen rows reshuffling
   eight times a second — so it holds while the clock or the camera is still
   travelling and snaps to the truth the moment they settle. `force` is for the
   interactions that must answer immediately: switching pane, typing in search. */
let railHeld=false;
/* Playback is deliberately excluded. The clock trails its target by a fixed
   amount while playing (~1.1 day-indices at 1x, ~2 at 2x), which would trip a
   plain lag test and freeze the board for the whole run — and a board that
   reorders as the month plays is the point of pressing play. It is also cheap
   there: consecutive days swap a row or two, not the wholesale reshuffle a drag
   across the timeline causes. */
const railMoving=()=>(!playing&&Math.abs(targetT-curT)>MOTION.railHold)
                  || Math.abs(view.tk-view.k)>0.004
                  || (performance.now()-lastInput)<MOTION.idleMs;
function paintRail(t,force){
  const now=performance.now();
  if(!force){
    if(document.hidden||!railOpen())return;   // collapsed for a screenshot, or a background tab
    if(railMoving()){railHeld=true;return;}
    /* first frame after a scrub lands, repaint at once rather than waiting out
       the throttle — the delay is what would read as the board lagging behind */
    if(railHeld)railHeld=false;
    else if(now-lastPaint<1000/MOTION.boardHz)return;
  }
  lastPaint=now;
  if(pane==='rank')paintRank(t);
  else if(pane==='flow')paintFlow(t);
  else if(pane==='move')paintMove(t);
  else if(pane==='fresh')paintFresh(t);
  else paintFind(t);
}

/* ===========================================================================
   6. BOOT — a short terminal sequence that sets tone and masks first layout
   ========================================================================= */
(function boot(){
  const lines=[
    ['LINKING COHORT', `${D.stats.cohort} WALLETS`],
    ['INDEXING TOKENS', `${D.nodes.length} / ${D.stats.tokens.toLocaleString()}`],
    ['RESOLVING ROTATIONS', `${D.edges.length}`],
    ['LOADING FRAMES', `${N}`],
    ['READY', '']
  ];
  const host=document.getElementById('bootlines');
  host.innerHTML=lines.map(([a,b])=>`<div>&gt; ${a} <span>${b}</span></div>`).join('');
  const els=[...host.children];
  els.forEach((el,i)=>setTimeout(()=>el.classList.add('on'),i*150));
  setTimeout(()=>document.getElementById('boot').classList.add('done'),900);
})();
addEventListener('resize',()=>{resize();fit(true);});
resize(); rebuildOrder(); fit(false); requestAnimationFrame(frame);
